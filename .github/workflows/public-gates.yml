name: Public Static & Governance Gates

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
      - 'deps-*'
  pull_request:

permissions:
  contents: read

jobs:
  public-gates:
    name: Static Contracts, Hygiene & Release Governance
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight test runner
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Check DCO sign-off validator
        run: python scripts/ci/check_dco.py --self-test

      - name: Verify PR commit DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci/check_dco.py --range "${PR_BASE_SHA}..${PR_HEAD_SHA}"

      - name: Check release and dependency version contracts
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            python scripts/check_release_version.py --branch "${BASE_REF}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            python scripts/check_release_version.py --tag "${REF_NAME}"
          else
            python scripts/check_release_version.py --branch "${REF_NAME}"
          fi
          python scripts/check_dependency_release.py

      - name: Check public repository hygiene
        run: |
          python scripts/check_public_hygiene.py --self-test
          python scripts/check_public_hygiene.py

      - name: Run board-free static contract gates
        run: |
          python scripts/check_examples.py
          python scripts/check_doc_references.py --self-test
          python scripts/check_doc_references.py
          python scripts/check_deps_declared.py --self-test
          python scripts/check_deps_declared.py
          python scripts/check_import_graph_v5.py
          python scripts/check_no_dup.py
          python scripts/check_no_hardcoded_paths.py --self-test
          python scripts/check_no_hardcoded_paths.py
          bash scripts/check_no_runtime_dp.sh
          python scripts/check_repo_bloat.py --self-test
          python scripts/check_repo_bloat.py
          python scripts/check_runtime_config_env.py
          python scripts/check_supported_models_table.py
          python scripts/check_v41_tombstone_imports.py
          python scripts/ci/check_documented_symbols_exist.py
          python scripts/check_ci_needs.py
          python scripts/check_ci_junit_coverage.py --self-test
          python scripts/check_ci_junit_coverage.py

      - name: Run governance, release, and plugin contract unit tests
        run: |
          python -m pytest -q \
            tests/test_release_version.py \
            tests/test_dependency_release.py \
            tests/test_public_package.py \
            tests/test_native_runtime_identity.py \
            tests/test_governance_gates.py
