# 未写出的执行参数（省略即按以下值运行）：
#   rpu_execution.model.num_cores 固定 8 核（可显式写 8；4/6 核不支持，原因见模型页配置表）。
# G0.5 K1：3 路真实相机，每路一帧，10 步 flow matching。
# 可直接修改 linear_acc32（false 为 ACC16，true 为 ACC32）、math_precision（base/high）和 text_tokens。
# 要一次测多个长度，把 text_tokens 换成 text_lengths 列表（每个长度在独立进程中运行），两个字段不能同时设置。
# 实际 prefix 长度 = T + 193；不补假 token 或图像。
[model]
target = "g05"
# 本文件的权重/计算配方；切换精度须同时使用对应权重。
precision = "fp16"
linear_acc32 = true
# HIGH 沿用 BASE 的调度，其耗时需要单独测量。
math_precision = "base"
# FP16 Vision 只支持 B1，auto 也会选 B1。
vision_camera_batch = "auto"
# 替换为匹配本模型与量化配方的本地资产路径或既有权重别名。
checkpoint = "/path/to/vla_rtc_release/checkpoint"
# 替换为匹配本模型与量化配方的本地资产路径或既有权重别名。
release_root = "/path/to/vla_rtc_release"

[input]
# batch 使用保存输入；synthetic 按真实 processor 构造，不共用两种输入字段。
source = "synthetic"
source_golden = "/path/to/g05_k1_rtc_cpu_golden.pt"
source_step = 1
# 有效文本 token 数，32–256 的整数（仅 synthetic）；多个长度改用 text_lengths = [32, 64, ...]。
text_tokens = 32
# 可选 2 / 3；真实图像数量与输入 tensor 必须同步修改。
cameras = 3
camera_names = ["head_rgb", "left_wrist_rgb", "right_wrist_rgb"]
# 当前模型路径的固定去噪步数，不作为任意可调范围。
num_steps = 10

[rpu_execution.components.language_model.prefill]
# prefill 分块行数。可选 "auto"（默认）或满足本组件形状限制的 16 的倍数整数。
# auto：由原生 planner 按实际输入行数选择。
# 实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"

[cpu]
# CPU intra-op 线程数，正整数；与 RPU 核数无关。
# 省略时本入口使用 8。
threads = 8

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 随机种子，非负整数。
seed = 7
# 结果输出目录；并发运行使用不同目录。
output_dir = "./g05_results/3cam/fp16"

# 三项须一起填写，main/expansion 的内容须与 manifests/dependency_manifest.v1.json 发布的 SHA-256 一致。
# 删除整个 [libraries] 表时，改用环境变量 RPU_BACKEND_SO / RPU_KERNEL_LIB_PATH / RPU_KERNEL_LIB_PATH_EXPANSION，
# 未设置时使用仓库 src/（或已安装 wheel）中的两个 REF 和已安装的 backend。--check-config 接受占位路径，运行时检查文件。
[libraries]
native = "/path/to/selected/rpu_backend.so"
main = "/path/to/selected/rhinoOpLib.ref"
expansion = "/path/to/selected/rhinoExpansionOpLib.ref"
