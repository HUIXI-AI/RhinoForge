# 未写出的执行参数（省略即按以下值运行）：
#   [cpu].threads 省略时不设置线程：PyTorch 使用环境变量 OMP_NUM_THREADS，未设置时使用全部 CPU 核（参考板 24）；2026-10-19 测量环境预设为 16。
#   rpu_execution.model.num_cores 固定 8 核（可显式写 8；4/6 核不支持，原因见模型页配置表）。
#   分块（chunk_size）模板未写出，按 auto 由入口选择；2026-10-19 模板默认输入实测：vision 32/272/784、prefill 160、action 32。可调范围见模型页。
[model]
profile_id = "internvla-n1-navdp.fp16.system2-rgbd-navdp"
registry_alias = "internvla-n1-controlled"
target = "internvla_n1"
precision = "fp16"
asset_manifest = "/path/to/asset_manifest.json"

[model.opt_in]

[input]
# 替换为匹配下列输入形状的文件；固定 fixture 须保留其身份与格式。
fixture = "/path/to/full_chain_fixture.pt"
sample_num = 4
# 固定随机种子；更改会改变输入噪声。
seed = 1

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 按需开启硬件采样；保持 false 可减少测量干扰。
hwperf = false
# 按需开启 profiler；正式计时建议保持 false。
profile = false
# 随机种子，非负整数。
seed = 0

[rpu_execution]
