# 未写出的执行参数（省略即按以下值运行）：
#   [cpu].threads 省略时不设置线程：PyTorch 使用环境变量 OMP_NUM_THREADS，未设置时使用全部 CPU 核（参考板 24）；2026-10-19 测量环境预设为 16。
#   rpu_execution.model.num_cores 固定 8 核（可显式写 8；4/6 核不支持，原因见模型页配置表）。
#   分块（chunk_size）模板未写出，按 auto 由入口选择；2026-10-19 模板默认输入实测：vision 256、prefill 240、action 64。可调范围见模型页。
# 已归档的 exact-Z2 复现配置；当前 FP16/W8A16 输入见 ../../v2/README.md。
# 本配置保留历史掩码与固定 P225 执行合同。
[model]
profile_id = "lingbot-vla-v2-6b.w8a16.exact-z2"
registry_alias = "lingbot-vla-v2-6b"
target = "lingbot2"
precision = "w8a16"

[model.opt_in]
RPU_LINGBOT2_MULTIVIEW_SPM_Z2 = "1"

[input]
# 替换为匹配下列输入形状的文件；固定 fixture 须保留其身份与格式。
observation = "/path/to/lingbot2_exact_z2_observation.pt"
# Graph 准备的真实 prefix 范围；固定 profile 不能任意扩大。
prefix_length_range = [215, 225]
# 固定随机种子；更改会改变输入噪声。
seed = 0

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 按需开启硬件采样；保持 false 可减少测量干扰。
hwperf = false
# 按需开启 profiler；正式计时建议保持 false。
profile = false
# 随机种子，非负整数。
seed = 0

[rpu_execution]
