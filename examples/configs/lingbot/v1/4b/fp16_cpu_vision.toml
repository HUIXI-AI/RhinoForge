# 未写出的执行参数（省略即按以下值运行）：
#   [cpu].threads 省略时不设置线程：PyTorch 使用环境变量 OMP_NUM_THREADS，未设置时使用全部 CPU 核（参考板 24）；2026-10-19 测量环境预设为 16。
#   rpu_execution.model.num_cores 固定 8 核（可显式写 8；4/6 核不支持，原因见模型页配置表）。
[model]
profile_id = "lingbot-vla-4b.mixed.vla"
registry_alias = "lingbot-vla-4b"
target = "lingbot"
precision = "fp16_cpu_vision"

[model.opt_in]

[input]
# 替换为匹配下列输入形状的文件；固定 fixture 须保留其身份与格式。
observation = "/path/to/lingbot_observation.pt"
# 当前模型路径的固定去噪步数，不作为任意可调范围。
num_steps = 10
max_seq = 256

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 按需开启硬件采样；保持 false 可减少测量干扰。
hwperf = false
# 按需开启 profiler；正式计时建议保持 false。
profile = false
# 随机种子，非负整数。
seed = 0

[rpu_execution]
