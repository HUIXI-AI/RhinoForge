# 未写出的执行参数（省略即按以下值运行）：
#   分块（chunk_size）模板未写出，按 auto 由入口选择；2026-10-19 模板默认输入实测：vision 768、prefill 240、action 64。可调范围见模型页。
# T 为完整、未截断指令的有效 token 数。
[model]
target = "lingbot2"
# 本文件的权重/计算配方；切换精度须同时使用对应权重。
precision = "w8a16"
instruction_residency = "auto"
# cap 默认 72；指令较长时可设至 160，并同步 expected_language_tokens。
# max_language_tokens = 160
# 替换为匹配本模型与量化配方的本地资产路径或既有权重别名。
checkpoint = "${RPU_MODEL_CACHE}/lingbot-vla-v2-6b"
training_config = "${LINGBOT2_TRAINING_CONFIG}"

[input]
# 替换为匹配下列输入形状的文件；固定 fixture 须保留其身份与格式。
observation = "${LINGBOT2_3CAM_T32_OBSERVATION}"
# 可选 2 / 3；真实图像数量与输入 tensor 必须同步修改。
cameras = 3
# 实际有效 token 数必须等于此值；可改为 1–160，并同步输入与 max_language_tokens。
expected_language_tokens = 32

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 随机种子，非负整数。
seed = 0
# 结果输出目录；并发运行使用不同目录。
output_dir = "results/lingbot2/3cam_t32/w8a16"
# 按需开启硬件采样；保持 false 可减少测量干扰。
hwperf = false
# 按需开启 profiler；正式计时建议保持 false。
profile = false

[cpu]
# CPU intra-op 线程数，正整数；与 RPU 核数无关。
# 省略时本入口使用 1。
threads = 1

[rpu_execution.model]
# RPU 核数预算。本入口固定 8 核，不支持其他值。
num_cores = 8

# auto 选择可准入的物理布局；补齐行不会增加有效 token。
[rpu_execution.prefill]
# 允许的物理补齐行上限，非负整数；省略时为 15，模板为 64。补齐行不增加有效 token。
# prefix 为 2cam 132+T、3cam 198+T 行，先对齐到 16 的倍数，再最多补 padding_budget 行。2026-10-23 板测：对齐后 144、160、176、
# 192、208、224、240、256、288、320、400 行有可行 prefill 布局，272、304、336、352、368、384 行没有（NO_FEASIBLE）。
# 取 64 时 T1–160 都能补到上述可行长度（最多 3cam 336→400）；取 15 时只用对齐长度本身，取 63 时 3cam T123–138（对齐 336 行）不可运行。
# 2026-10-30 在 native 997a369c（运行库 main 4b7e723d / expansion 9f7a2081）上复验 3cam T128（对齐 336 行）/ padding_budget=63：
# fp16 与 w8a16 仍以 NO_FEASIBLE（seq_len=336）被拒，上面的可行与不可行长度未变。
padding_budget = 64
