# 未写出的执行参数（省略即按以下值运行）：
#   [cpu].threads 省略时本入口使用 8。
#   分块（chunk_size）模板未写出，按 auto 由入口选择：8 核 T192 为配对 prefill C480（P960 = 2×480），
#   4/6 核按预算自动选择通用分块（4 核 4×240，6 核 3×320）。可调范围见模型页。
# Pi0.5 统一入口：openpi pi05 Kuavo 仿真全身（双臂 16 + 下肢 4），输入为相机原尺寸帧、指令和物理 state。
[model]
target = "pi05"
# 本文件的权重/计算配方；切换精度须同时使用对应权重。
precision = "w8a16"
# 替换为 action/state 宽度为 20 的 pi05 checkpoint（准备方法见权重页 Kuavo 一节）。
checkpoint = "/path/to/pi05_base_kuavo_a20-w8a16"

[input]
# 三路相机原尺寸 RGB 帧，顺序为 头部 / 左腕 / 右腕（base_0_rgb / left_wrist_0_rgb / right_wrist_0_rgb）；
# 公开示例帧（仿真 640×480，乐聚 ICRA 仿真数据 TASK2 包裹称重）由 scripts/prepare_pi05_kuavo_inputs.py --sim-bag 生成。
images = ["/path/to/kuavo/frames_sim/cam_h.png", "/path/to/kuavo/frames_sim/cam_l.png", "/path/to/kuavo/frames_sim/cam_r.png"]
# 相机帧尺寸 [宽, 高]，即 kuavo_deploy 的 env.image_size：真机 [848, 480]，仿真 [640, 480]；尺寸不符的帧拒绝运行。
# 每次推理在计时内按 openpi resize_with_pad 缩放到模型输入 224×224（640×480 → 224×168，上下各补 28 行黑边）。
frame_size = [640, 480]
# 本入口的 openpi 原始输入固定 3 路相机。
cameras = 3
# 任务指令（含 BOS 共 75 个 PaliGemma token）；入口按 openpi 格式拼入离散化 state。
instruction = "Flip the express parcel on the scanning table: grasp the white courier bag with both dexterous hands, lift it slightly, turn it over carefully so that the printed shipping label with the barcode faces up toward the scanner, then lay it flat in the middle of the table, release both hands gently, and move both arms back to the ready pose above the moving conveyor belt."
# 物理 state，顺序 [左臂 7, 左夹爪 1, 右臂 7, 右夹爪 1, 下肢 4]；臂关节单位 rad；仿真末端为 Robotiq 2F-85 夹爪，0..1（LeTools 把夹爪位置除以 0.8）。
# 公开数据没有 5-W 下肢关节：示例下肢 4 维 state 为 0，norm stats 为恒等占位（q01=-1, q99=1），须换成真实统计。
state = [-0.17082052, -0.0007066936, -6.183119e-05, -1.7355931, -1.5709333, -0.6938957, -0.0019370777, 0.0034228405, -0.015517442, 0.1821247, 0.36460945, -1.7563727, 1.571314, 0.301175, 0.017514855, 0.8858054, 0.0, 0.0, 0.0, 0.0]
# openpi norm_stats.json（quantile 归一化，须含 state；含 actions 时额外输出物理动作）。
norm_stats = "/path/to/kuavo/norm_stats/wholebody/norm_stats.json"
# openpi 的 PaliGemma sentencepiece 模型；需要 pip install sentencepiece。
tokenizer = "/path/to/paligemma_tokenizer.model"
# 训练时按 delta 表示的动作维（openpi make_bool_mask）；用于把输出还原为绝对动作。
delta_action_mask = [true, true, true, true, true, true, true, false, true, true, true, true, true, true, true, false, true, true, true, true]
# 输出动作宽度，须与 checkpoint 的 output_features.action 一致。
action_dim = 20
# 语言存储宽度可选 32 / 64 / 96 / 128 / 160 / 192（192 仅限 3 路相机、FP16 / W8A16）；
# 有效 token（BOS + 指令 + 离散 state + "Action: "）超过宽度时拒绝运行。
# 本模板的 75 token 指令加 20 维 state 约需 124–165 token，所以用 192。
text_tokens = 192
# 当前模型路径的固定去噪步数，不作为任意可调范围。
num_steps = 10

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 随机种子，非负整数。
seed = 0
# 结果输出目录；并发运行使用不同目录。
output_dir = "./pi05_results/kuavo/sim/wholebody/w8a16"

[rpu_execution.model]
# RPU 核数预算。可选 4 / 6 / 8，默认 8；修改后需重新加载模型。
num_cores = 8
