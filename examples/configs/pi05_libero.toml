# 单一完整模板 / Single complete template：注释行展示默认值，取消注释才覆盖运行时。
# Complete Pi0.5 runner example. Profile selectors remain owned by the policy;
# see the Pi0.5 section of docs/runtime_config.md before overriding them.
[runner]
target = "pi05"

[runner.env]
# 通用参数 / Common。注释行给出默认值；取消注释才覆盖 facade 默认行为。
RPU_LOG_LEVEL = 3 # 默认 3；允许 0..5；进程日志级别。
# RPU_WARMUP = 0 # 默认 0；非负整数；模型构建后的预热 forward 次数。
# RPU_MODEL_CACHE = "~/.cache/rhinoforge/models" # 默认模型别名缓存根目录。
# HF_HOME / HF_HUB_CACHE / HUGGINGFACE_HUB_CACHE：默认继承 Hugging Face；自定义缓存位置时设置。
# LKN_MAX_BATCH_ENTRIES = 65536 # 默认 65536；范围 1..4194304；Graph 提交容量。
# LKN_KD_BUF_MB = 8 # 默认 8；范围 1..256 MiB；Graph 命令容量。
# LKN_INSTR_BUF_MB = 64 # 默认 64；范围 1..1024 MiB；Graph 执行缓存容量。
# RPU_KERNEL_LIB_PATH 由部署环境设置；runner 拒绝从 TOML 选择算子资产。
# RPU_KVINSERT_V16 = true # 默认 true；允许 0/1；合法布局使用 16 行 KV insert，否则自动回退。
RPU_PI05_FUSED_DENOISE = true # 默认 true；融合 denoise；false 回退逐步路径。
RPU_PI05_KVINSERT_PAD16 = true # 默认 false；本 LIBERO profile 开启 16 行对齐 KV insert。
# RPU_WALL_OSS_FAST_REPLAY = true # adapter 默认 true；稳定 Graph replay 快路径。
# RPU_FASTREPLAY_SKIP_SYNC = true # adapter 默认 true；仅与稳定 replay profile 配套。
# RPU_DEEP_FAST_REPLAY = true # adapter 默认 true；仅与稳定 replay profile 配套。
# RPU_PI05_DENOISE_UNROLL = true # adapter 默认 true；整段 denoise 录制为一个 Graph。
# RPU_PI05_GEMMA_GRAPH = true # 默认 true；Gemma VLM 使用 GraphCache。
# RPU_PI05_SIGLIP_GRAPH = true # 默认 true；SigLIP 使用 GraphCache。
# RPU_PI05_ADARMS_GRAPH = true # 默认 true；FP16 AdaRMS 使用 GraphCache。
# RPU_PI05_ADARMS_W8A16_GRAPH = true # 默认 true；W8A16 AdaRMS 使用 GraphCache。
# RPU_PI05_DENOISE_GRAPH = true # 默认 true；融合 denoise step 使用 GraphCache。
# RPU_PI05_PREFIX_PAD16 = true # 默认 true；允许 prefix 补齐到 16 行。
# RPU_PI05_SIGLIP_BATCH = true # 默认 true；合并兼容的相机输入。
# RPU_PI05_SIGLIP_W8A16 = false # 默认按模型 dtype 自动；显式 true/false 覆盖。
# RPU_PI05_SIGLIP_W8A16_SCOPE = "all" # 默认 all；允许 all,row,out,fc2,none。
# RPU_PI05_ADARMS_DENSE_W8A16 = false # 默认按模型 dtype 自动；显式 true/false 覆盖。
# RPU_PI05_PREFIX_MASK_CACHE = true # 默认 true；复用一项 prefix mask；每次调用读取。
# RPU_PI05_EMBED_PREFIX_PATCH = true # 默认 true；安装支持的 prefix embedding patch。

[runner.torch_profile]
enabled = false # 默认 false；启用整次命令的 Torch profiler。
output = "profiles/pi05_libero_torch.json" # 默认 profiles/torch_trace.json；Chrome trace 输出路径。
record_shapes = false # 默认 false；记录算子输入 shape。
profile_memory = false # 默认 false；记录内存事件。
with_stack = false # 默认 false；记录 Python stack，开销更高。

[rpu_execution.prefill]
chunk_size = "auto" # 默认 auto；也可用满足模型约束的 16 倍数。
padding_budget = 64 # 默认 64；非负整数；与 padding_rows 二选一。
# padding_rows = "auto" # 默认 auto；也可指定非负整数；启用时删除 padding_budget。
# Use padding_rows instead of padding_budget to request an exact row count.

[rpu_execution.vision]
chunk_size = "auto" # 默认 auto；也可用满足模型约束的 16 倍数。

[rpu_execution.action]
chunk_size = "auto" # 默认 auto；也可用满足模型约束的 16 倍数。

[model]
alias = "pi05-libero-finetuned"

[request]
batch_file = "assets/pi05_batch.pt"
num_steps = 10
prepare_graphs = false
