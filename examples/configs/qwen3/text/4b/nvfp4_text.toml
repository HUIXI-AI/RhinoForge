# 未写出的执行参数（省略即按以下值运行）：
#   [cpu].threads 省略时不设置线程：PyTorch 使用环境变量 OMP_NUM_THREADS，未设置时使用全部 CPU 核（参考板 24）；2026-10-19 测量环境预设为 16。
# 使用官方 Qwen3-4B 浮点权重，冷启动安装时转换一次。
# Decoder 七投影 NVFP4：E2M1 权重，每 16 个输入通道一个 E4M3 块缩放，每投影每层一个 FP32 张量缩放；输出头、embedding、norm 为 FP16。
# 默认 ACC16；尚未上板实测，任务质量未评估。
[model]
profile_id = "qwen3-4b.nvfp4.text"
registry_alias = "qwen3-4b"
target = "qwen3"
precision = "nvfp4_text"
architecture = "Qwen3ForCausalLM"

[model.opt_in]

[input]
# 可替换文本；自然输入长度由 tokenizer 决定。
prompt = "Explain what a compiler does."
# 固定 prefill token 数，整数 ≥1；图文不能截断 processor 生成的完整输入。
prefill_tokens = 128
# 首 token 之后的 decode 调用数，整数 ≥0；P 与 D 受 cache 和模型输入范围共同约束。
decode_steps = 7
# true 在 EOS 提前结束；false 使用固定 decode_steps。
stop_on_eos = false

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 按需开启硬件采样；保持 false 可减少测量干扰。
hwperf = false
# 按需开启 profiler；正式计时建议保持 false。
profile = false
# 随机种子，非负整数。
seed = 0

[rpu_execution.model]
# RPU 核数预算。可选 4 / 6 / 8，默认 8；修改后需重新加载模型。
# 6 核时文本组件分配为 Attention 4、MLP 6、输出头 6。
# 6 核时 MLP 在量化前补零到 384 对齐（9728 → 9984），4 核和 8 核不补。
# 实际分配见模型页配置表的“4 核 / 6 核”列。
num_cores = 8

[rpu_execution.prefill]
# Prefill 分块行数。可选 "auto"（默认），或不超过 256 的 16 的倍数。
# auto：实际行数 P 向上取整对齐后，在不超过上限的候选中选分块最少、补齐最少的一种；
# P 不超过上限时通常只分一块（例：P=7 → 16），超过上限时按上限分块。
# 实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"
# Linear 累加精度。false 为 ACC16，true 为 ACC32；不改变权重位宽。
# 省略时默认 false（ACC16）。修改后需重新加载模型。
linear_acc32 = false
