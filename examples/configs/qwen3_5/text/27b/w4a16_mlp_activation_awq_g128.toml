[model]
profile_id = "qwen3_5-27b.activation-awq-g128.text-controlled"
registry_alias = "qwen3_5-27b-activation-awq-g128"
target = "qwen3_5"
precision = "w4a16_mlp_activation_awq_g128"
architecture = "Qwen3_5ForConditionalGeneration"

[model.opt_in]

[input]
# 不填时使用自然输入长度；固定 P 可设置正整数，P/D 联动范围见模型说明。
# prefill_tokens = 128
# 可替换文本；自然输入长度由 tokenizer 决定。
prompt = "Explain what a compiler does."
# 首 token 之后的 decode 调用数，整数 ≥0；P 与 D 受 cache 和模型输入范围共同约束。
decode_steps = 4

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 是否启用 inference_mode；复现已有测量时保持原值。
inference_mode = true
# 计时方式；切换时须满足对应输入合同，不能直接混比结果。
timing_mode = "per_call"
# 按需开启硬件采样；保持 false 可减少测量干扰。
hwperf = false
# 按需开启 profiler；正式计时建议保持 false。
profile = false
# 随机种子，非负整数。
seed = 0

[rpu_execution.model]
# RPU 核数预算。可选 4 / 6 / 8，默认 8；修改后需重新加载模型。
# 6 核时文本组件分配为 Attention 4、MLP 6、输出头 6。
# Vision 在 4/6 核下用 4 核。实际分配见模型页配置表的“4 核 / 6 核”列。
num_cores = 8

[rpu_execution.prefill]
# Prefill 分块行数。可选 "auto"（默认），或不超过 128 的 64 的倍数。
# auto：实际行数 P 向上取整对齐后，在不超过上限的候选中选分块最少、补齐最少的一种；
# P 不超过上限时通常只分一块（例：P=7 → 64、P=80 → 128），超过上限时按上限分块。
# 2026-10-19 模板默认输入实测：8/6/4 核均为 64。
# 实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"
# Linear 累加精度。false 为 ACC16，true 为 ACC32；不改变权重位宽。
# 省略时默认 false（ACC16）。修改后需重新加载模型。
linear_acc32 = false

[cpu]
# CPU intra-op 线程数，正整数；与 RPU 核数无关。
# 省略时不设置线程：PyTorch 使用环境变量 OMP_NUM_THREADS，未设置时使用全部 CPU 核（参考板 24）；2026-10-19 测量环境预设为 16。
threads = 4
