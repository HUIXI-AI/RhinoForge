[model]
profile_id = "qwen3_5-35b-a3b.rtn-w8a16.text"
registry_alias = "qwen3_5-35b-a3b-rtn-w8a16"
target = "qwen3_5"
precision = "w8a16_experts"
architecture = "Qwen3_5MoeForConditionalGeneration"

[input]
# 固定 P 时改用 prompt_file + prompt_sha256 + input_ids_sha256，移除 prompt；
# 同时设置 run.timing_mode="forward_argmax"、stop_on_eos=false；示例见模型说明。
# prefill_tokens = 4096
# 可替换文本；自然输入长度由 tokenizer 决定。
prompt = "A compiler translates source code into executable instructions. Its main stages are"
# 首 token 之后的 decode 调用数，整数 ≥0；P 与 D 受 cache 和模型输入范围共同约束。
decode_steps = 31

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 是否启用 inference_mode；复现已有测量时保持原值。
inference_mode = false
# 按需开启硬件采样；保持 false 可减少测量干扰。
hwperf = false
# 按需开启 profiler；正式计时建议保持 false。
profile = false
# 随机种子，非负整数。
seed = 0

[rpu_execution.model]
# RPU 核数预算。可选 4 / 6 / 8，默认 8；修改后需重新加载模型。
# 6 核时文本组件分配为 Attention 4、MLP 6、输出头 6。
# Vision 在 4/6 核下用 4 核。实际分配见模型页配置表的“4 核 / 6 核”列。
num_cores = 8

[rpu_execution.prefill]
# Prefill 分块行数。可选 "auto"（默认），或不超过 512 的 64 的倍数。
# auto：实际行数 P 向上取整对齐后，在不超过上限的候选中选分块最少、补齐最少的一种；
# P 不超过上限时通常只分一块（例：P=7 → 64、P=80 → 128），超过上限时按上限分块。
# 本配置还没有上板实测。实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"
# 路由专家常驻 prefill 数据流。本配置只能取 false（省略时同）：常驻数据流只接受 UINT4 或
# E4M3 路由权重，INT8 设 true 会在安装前报错，不会静默退回普通数据流。
moe_resident_prefill = false
# Linear 累加精度。本配置只能取 false（ACC16，省略时同）：INT8 路由专家只实现了 ACC16，
# 设 true 会在安装前报错。修改后需重新加载模型。
linear_acc32 = false

[cpu]
# CPU intra-op 线程数，正整数；与 RPU 核数无关。
# 省略时不设置线程：PyTorch 使用环境变量 OMP_NUM_THREADS，未设置时使用全部 CPU 核（参考板 24）；2026-10-19 测量环境预设为 16。
threads = 24
