
[model]
profile_id = "qwen3_5-27b.w8a16.vision-controlled"
registry_alias = "qwen3_5-27b-w8a16"
target = "qwen3_5_vision"
precision = "w8a16_text"
architecture = "Qwen3_5ForConditionalGeneration"

[model.opt_in]

[input]
# 不填时使用完整图文输入；固定 P 不得小于 processor 输出的总 token 数。
# prefill_tokens = 512
# 替换图像路径；相机数量、处理后尺寸和文本长度需满足本模型输入范围。
images = ["python/rpu_backend/tests/model/wall_oss/assets/test_frame.png"]
# 可替换文本；自然输入长度由 tokenizer 决定。
prompt = "Describe the image."
# 首 token 之后的 decode 调用数，整数 ≥0；P 与 D 受 cache 和模型输入范围共同约束。
decode_steps = 32
# true 在 EOS 提前结束；false 使用固定 decode_steps。
stop_on_eos = false

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 是否启用 inference_mode；复现已有测量时保持原值。
inference_mode = true
# 计时方式；切换时须满足对应输入合同，不能直接混比结果。
timing_mode = "per_call"
# 按需开启硬件采样；保持 false 可减少测量干扰。
hwperf = false
# 按需开启 profiler；正式计时建议保持 false。
profile = false
# 随机种子，非负整数。
seed = 0

[rpu_execution.model]
# RPU 核数预算。可选 4 / 6 / 8，默认 8；修改后需重新加载模型。
# 6 核时文本组件分配为 Attention 4、MLP 6、输出头 6。
# Vision 在 4/6 核下用 4 核。实际分配见模型页配置表的“4 核 / 6 核”列。
num_cores = 8

[rpu_execution.prefill]
# Prefill 分块行数。可选 "auto"（默认），或不超过 128 的 64 的倍数。
# auto：实际行数 P 向上取整对齐后，在不超过上限的候选中选分块最少、补齐最少的一种；
# P 不超过上限时通常只分一块（例：P=7 → 64、P=80 → 128），超过上限时按上限分块。
# 2026-10-19 模板默认输入实测：8 核 128、6 核 64、4 核 64。
# 实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"
# Linear 累加精度。false 为 ACC16，true 为 ACC32；不改变权重位宽。
# 省略时默认 false（ACC16）。修改后需重新加载模型。
linear_acc32 = false

[rpu_execution.vision]
# Vision 分块行数。可选 "auto"（默认）或 16 的倍数整数；不补齐行。
# auto：由原生 planner 按图像 patch 数与本模型的核数选择。
# 2026-10-19 模板默认输入实测：8/6/4 核均为 256。
# 实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"
# Linear 累加精度。false 为 ACC16，true 为 ACC32；不改变权重位宽。
# 省略时默认 false（ACC16）。修改后需重新加载模型。
linear_acc32 = false

[cpu]
# CPU intra-op 线程数，正整数；与 RPU 核数无关。
# 省略时不设置线程：PyTorch 使用环境变量 OMP_NUM_THREADS，未设置时使用全部 CPU 核（参考板 24）；2026-10-19 测量环境预设为 16。
threads = 8
