# Public configuration; provide your own checkpoint and input assets.

[example]
profile_id = "qwen3_5-35b-a3b.mixed-e4m3.multimodal-tp8"
registry_alias = "qwen3_5-35b-a3b-mixed"
target = "qwen3_5_vision"
dtype = "mixed-e4m3"
architecture = "Qwen3_5MoeForConditionalGeneration"

[input]
images = ["assets/example.ppm"]
prompt = "Describe the image."
decode_steps = 4

[run]
warmup = 1
runs = 3
hwperf = false
profile = false
seed = 0

[rpu_execution]

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"

[rpu_execution.vision]
chunk_size = "auto"
