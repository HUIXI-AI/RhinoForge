# Public configuration; provide your own checkpoint and input assets.

[example]
profile_id = "qwen3_5-4b.fp16.vision-controlled"
registry_alias = "qwen3_5-4b"
target = "qwen3_5_vision"
dtype = "fp16"
architecture = "Qwen3_5ForConditionalGeneration"

[example.opt_in]
QWEN3_5_VISION_ALLOW_NUMERIC_BLOCKED = "1"

[input]
images = ["assets/example.ppm"]
prompt = "Describe the image."
decode_steps = 4

[run]
warmup = 1
runs = 3
hwperf = false
profile = false
seed = 0

[rpu_execution]

[rpu_execution.prefill]
chunk_size = "auto"

[rpu_execution.vision]
chunk_size = "auto"
