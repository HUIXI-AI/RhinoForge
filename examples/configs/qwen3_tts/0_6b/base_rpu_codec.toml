# Experimental: 31 Conv1d and six transposed-convolution projections on RPU; remaining activations on CPU.
[qwen3_tts]
checkpoint = "/path/to/Qwen3-TTS-12Hz-0.6B-Base"
source = "/path/to/qwen3-tts-prepared/qwen_tts"
codec_backend = "rpu"

[input]
text = "你好，欢迎使用语音助手。"
reference_audio = "/path/to/mono-24k.wav"
language = "Chinese"
max_new_tokens = 256

[cpu]
threads = 16

[run]
warmup = 2
runs = 5
seed = 0
output_dir = "/tmp/qwen3-tts-rpu-codec-result"
