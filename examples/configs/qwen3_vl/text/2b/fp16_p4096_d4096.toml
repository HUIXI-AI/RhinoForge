# Public configuration; provide your own checkpoint and input assets.

[example]
profile_id = "qwen3-vl-2b.fp16.text"
registry_alias = "qwen3-vl-2b"
target = "qwen3_vl"
dtype = "fp16"
architecture = "Qwen3VLForConditionalGeneration"

[example.opt_in]

[input]
component = "text"
prompt = "Describe this image in one sentence."
prefill_tokens = 4096
decode_steps = 4096
stop_on_eos = false

[run]
warmup = 1
warmup_decode_steps = 3
runs = 1
inference_mode = false
hwperf = false
profile = false
seed = 0

[rpu_execution]

[rpu_execution.prefill]
fast_replay = true
chunk_size = "auto"
