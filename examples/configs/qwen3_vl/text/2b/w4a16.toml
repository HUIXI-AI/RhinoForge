# Public configuration; provide your own checkpoint and input assets.

[example]
profile_id = "qwen3-vl-2b-runtime-w4a16.w4a16.text"
registry_alias = "qwen3-vl-2b-runtime-w4a16"
target = "qwen3_vl"
dtype = "w4a16"
architecture = "Qwen3VLForConditionalGeneration"

[example.opt_in]

[input]
component = "text"
prompt = "Explain what a compiler does."
prefill_tokens = 512
decode_steps = 31
stop_on_eos = false

[run]
warmup = 2
runs = 5
inference_mode = false
hwperf = false
profile = false
seed = 0

[rpu_execution]

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"
linear_acc32 = false
fast_replay = true

[rpu_execution.vision]
chunk_size = "auto"
linear_acc32 = false
