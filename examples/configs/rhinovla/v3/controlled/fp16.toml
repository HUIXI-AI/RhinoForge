# 未写出的执行参数（省略即按以下值运行）：
#   CPU 线程：用 run.py 运行时，[cpu].threads 省略则不设置线程（PyTorch 使用 OMP_NUM_THREADS，未设置时使用全部 CPU 核，参考板 24；2026-10-20 run.py 实测环境为 16）；validate_v3.py 不读取 [cpu]，线程数用其 --threads 参数设置，默认 12。
# 对应 v3 steps_150000 non-RTC 配方，由 examples/run.py 运行；validate_v3.py 也读取本文件做运行时校验。
# 保留 10 步去噪和全部 18 层 FP16 权重。
[model]
profile_id = "rhinovla.v3.fp16.source"
registry_alias = "rhinovla-controlled"
target = "rhinovla"
# 与下方 [model.opt_in] 的 W8A16 开关一致：任一为 "1" 时为 w8a16，否则为 fp16。
precision = "fp16"
# v3 steps_150000 non-RTC 源码目录（含模型代码与 qwen3_vl_processor 资产）。
source_dir = "/path/to/rhinovla-v3/source"
# 与源码配套的 checkpoint 文件；加载时核对 SHA256。
checkpoint = "/path/to/rhinovla-v3/source/models/rhinovla_v3/steps_150000/model.pt"

# 本配方的冷启动开关，须与登记 profile 完全一致；修改会被拒绝。关闭的开关也写为 "0"，
# 运行时 shell 中继承的同名环境变量若与此不同，会直接报错，不会悄悄改变精度或配方。
[model.opt_in]
RPU_RHINOVLA_VISION_BATCH_VIEWS = "1"
RPU_RHINOVLA_VISION_PREP_CACHE = "1"
RPU_RHINOVLA_DENOISE_STATIC_CONTEXT_CACHE = "1"
RPU_RHINOVLA_PRECOMPUTE_ADARMS = "1"
RPU_RHINOVLA_GATED_NO_SUB = "1"
RPU_RHINOVLA_FUSED_SILU_MUL = "1"
RPU_RHINOVLA_EXPERT_FUSIONS = "1"
RPU_RHINOVLA_ADARMS_RESIDENT = "1"
RPU_RHINOVLA_ALIGNED_KV = "1"
RPU_RHINOVLA_FULL_W8A16 = "0"
RPU_RHINOVLA_EXPERT_W8A16 = "0"
RPU_RHINOVLA_PACKED_QKV = "0"
RPU_RHINOVLA_SKIP_ADARMS_GEMV = "0"
RPU_RHINOVLA_PRECOMPUTE_GATE_TANH = "0"
RPU_RHINOVLA_VISION_INPUT_CACHE = "0"
RPU_RHINOVLA_HIGH_PRECISION = "0"
RPU_RHINOVLA_HIGH_PRECISION_FUSIONS = "0"
RPU_RHINOVLA_VECTOR_K_NORM = "0"
RPU_RHINOVLA_VECTOR_Q_NORM = "0"
RPU_RHINOVLA_PARTIAL_ROPE = "0"

[input]
fixture = "/path/to/rhinovla-v3/cpu_fixture.pt"
# 加载上游模型代码须显式确认。
trust_model_code = true
# 只支持 10 步去噪。
num_steps = 10

[run]
warmup = 2
runs = 5
seed = 0
output_dir = "./rhinovla_results/v3/source/fp16"

[rpu_execution.vision]
rpu_patch_embed = true
rpu_mergers = true
fused_merger = true
# vision Graph 快速回放，冷启动时选定，与累加精度设置无关。true 开启（模板默认），false 关闭。
# 省略时为 false。修改后需重新加载模型。
fast_replay = true
preload_replay_skip = true
bake_merger = true

[rpu_execution.prefill]
prefix_prep_cache = true
prefix_prep_rpu = true
prefix_no_clone = true
partial_mrope = true
merger_scatter = true
# prefill Graph 快速回放，冷启动时选定，与累加精度设置无关。true 开启（模板默认），false 关闭。
# 省略时为 false。修改后需重新加载模型。
fast_replay = true
preload_replay_skip = true

[rpu_execution.action]
denoise_unroll = true
shared_cache = true
prefix_alias = true
# action Graph 快速回放，冷启动时选定，与累加精度设置无关。true 开启（模板默认），false 关闭。
# 省略时为 false。修改后需重新加载模型。
fast_replay = true
