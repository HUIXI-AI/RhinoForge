# 未写出的执行参数（省略即按以下值运行）：
#   rpu_execution.model.num_cores 省略为 8；可写 4 / 6，修改后需重新加载模型：动作专家与文本为 Attention 4、MLP 4/6，Vision 用 4 核；
#     只有 8 核实现的选项（专家融合、常驻 AdaRMS 表、对齐 KV、融合/烘焙 merger、merger scatter、多视角批处理、视觉输入缓存）在 4/6 核自动关闭。
#     HIGH 系列在 4/6 核同样生效：Vision merger 不融合，其 GELU 为分离 merger 的精确 ERF（在 CPU 上计算）；AdaRMS 表与 gate tanh 每层从 DDR 读取。
#   CPU 线程：用 run.py 运行时，[cpu].threads 省略则不设置线程（PyTorch 使用 OMP_NUM_THREADS，未设置时使用全部 CPU 核，参考板 24；2026-10-20 run.py 实测环境为 16）；validate_rhinovla_v3.py 不读取 [cpu]，线程数用其 --threads 参数设置，默认 12。
# HIGH：SiLU/TANH/GELU-ERF/GELU-tanh 高精度实现与 Newton RMSNorm。
# 保留全部 W8 Linear；Newton+shift 与 HIGH SiLU*up 使用加法融合。
# 对应 v3 steps_150000 non-RTC 配方，由 examples/run.py 运行；validate_rhinovla_v3.py 也读取本文件做运行时校验。
# 所有执行的 Linear 权重为 INT8，scale 与激活为 FP16，包括
# patch、merger、prefix、expert、动作 IO 以及冷启动时的 AdaRMS 表生成。
# Norm、bias、embedding 和位置张量保持浮点。
[model]
profile_id = "rhinovla.v3.w8a16-pipeline-high-fused.source"
registry_alias = "rhinovla-controlled"
target = "rhinovla"
# 登记的精度配方（manifests/precision_recipes.v1.json）；RPU_RHINOVLA_FULL_W8A16 / EXPERT_W8A16 与 factory 的 expert_w8a16 / full_w8a16 由配方设置，TOML 中写出会被拒绝。
precision = "w8a16_pipeline"
# v3 steps_150000 non-RTC 源码目录（含模型代码与 qwen3_vl_processor 资产）。
source_dir = "/path/to/rhinovla-v3/source"
# 与源码配套的 checkpoint 文件；加载时核对 SHA256。
checkpoint = "/path/to/rhinovla-v3/source/models/rhinovla_v3/steps_150000/model.pt"

# 本配方的冷启动开关，须与登记 profile 完全一致；修改会被拒绝。关闭的开关也写为 "0"，
# 运行时 shell 中继承的同名环境变量若与此不同，会直接报错，不会悄悄改变精度或配方。
[model.opt_in]
RPU_RHINOVLA_VISION_BATCH_VIEWS = "1"
RPU_RHINOVLA_VISION_PREP_CACHE = "1"
RPU_RHINOVLA_DENOISE_STATIC_CONTEXT_CACHE = "1"
RPU_RHINOVLA_PRECOMPUTE_ADARMS = "1"
RPU_RHINOVLA_GATED_NO_SUB = "1"
RPU_RHINOVLA_FUSED_SILU_MUL = "1"
RPU_RHINOVLA_EXPERT_FUSIONS = "1"
RPU_RHINOVLA_ADARMS_RESIDENT = "1"
RPU_RHINOVLA_ALIGNED_KV = "1"
RPU_RHINOVLA_PACKED_QKV = "0"
RPU_RHINOVLA_SKIP_ADARMS_GEMV = "0"
RPU_RHINOVLA_PRECOMPUTE_GATE_TANH = "1"
RPU_RHINOVLA_VISION_INPUT_CACHE = "1"
RPU_RHINOVLA_HIGH_PRECISION = "1"
RPU_RHINOVLA_HIGH_PRECISION_FUSIONS = "1"
RPU_RHINOVLA_VECTOR_K_NORM = "0"
RPU_RHINOVLA_VECTOR_Q_NORM = "0"
RPU_RHINOVLA_PARTIAL_ROPE = "0"

[input]
# validate_rhinovla_v3.py prepare 阶段生成的输入 fixture；运行时使用其中第 1 组输入。
# 也可删去 fixture，改写原始输入 images、instruction、state（可选 view_roles、action_dims），二者只能写一种，见 README。
fixture = "/path/to/rhinovla-v3/cpu_fixture.pt"
# 加载上游模型代码须显式确认。
trust_model_code = true
# 只支持 10 步去噪。
num_steps = 10

[run]
warmup = 2
runs = 5
seed = 0
output_dir = "./rhinovla_results/v3/source/w8a16_pipeline_high_fused"

[rpu_execution.vision]
rpu_patch_embed = true
rpu_mergers = true
fused_merger = true
# vision Graph 快速回放，冷启动时选定，与累加精度设置无关。true 开启（模板默认），false 关闭。
# 省略时为 false。修改后需重新加载模型。
fast_replay = true
preload_replay_skip = true
bake_merger = true

[rpu_execution.prefill]
# pipeline 配方要求 prefix 物理行数 16 对齐（KV 写入对齐）。默认提示词实际 P230，补 10 行到 P240；
# 输入的 prefix 长度不同时，改为补到下一个 16 的倍数所需的行数（不增加有效 token）。
padding_rows = 10
prefix_prep_cache = true
prefix_prep_rpu = true
prefix_no_clone = true
partial_mrope = true
merger_scatter = true
# prefill Graph 快速回放，冷启动时选定，与累加精度设置无关。true 开启（模板默认），false 关闭。
# 省略时为 false。修改后需重新加载模型。
fast_replay = true
preload_replay_skip = true

[rpu_execution.action]
denoise_unroll = true
shared_cache = true
prefix_alias = true
# action Graph 快速回放，冷启动时选定，与累加精度设置无关。true 开启（模板默认），false 关闭。
# 省略时为 false。修改后需重新加载模型。
fast_replay = true
