# V3 RTC: same precision and optimizations as w8a16_pipeline.toml.
# factory.json must set rtc=true; request.pt supplies action_prefix and delay=0..6.
# 未写出的执行参数（省略即按以下值运行）：
#   rpu_execution.model.num_cores 省略为 8；可写 4 / 6，修改后需重新加载模型：动作专家与文本为 Attention 4、MLP 4/6，Vision 用 4 核。
# 全流程 W8A16：expert、prefix、vision 投影、动作 IO 和冷启动 AdaRMS。
# 非线性与 norm 使用基础实现，Linear 为 ACC16；HIGH 与 vector Q/K norm 关闭。
# 运行检查、数值诊断与任务质量评估相互独立。
[model]
profile_id = "rhinovla.v3.rtc.w8a16.full-pipeline.trusted-factory"
registry_alias = "rhinovla-controlled"
target = "rhinovla"
# 登记的精度配方（manifests/precision_recipes.v1.json）；RPU_RHINOVLA_FULL_W8A16 / EXPERT_W8A16 与 factory 的 expert_w8a16 / full_w8a16 由配方设置，TOML 中写出会被拒绝。
precision = "w8a16_pipeline"
# 替换为匹配本模型与量化配方的本地资产路径或既有权重别名。
checkpoint = "/path/to/rhinovla-v3/checkpoint"
# 调用者可信 module:callable；实际 request 格式由该 factory 定义。
runtime_factory = "rpu_backend.adapters.rhinovla.factory:v3_runtime_factory"
factory_config = "/path/to/rhinovla-v3/rtc_factory.json"

[model.opt_in]
RPU_RHINOVLA_VISION_BATCH_VIEWS = "1"
RPU_RHINOVLA_VISION_PREP_CACHE = "1"
RPU_RHINOVLA_DENOISE_STATIC_CONTEXT_CACHE = "1"
RPU_RHINOVLA_PRECOMPUTE_ADARMS = "1"
RPU_RHINOVLA_GATED_NO_SUB = "1"
RPU_RHINOVLA_FUSED_SILU_MUL = "1"
RPU_RHINOVLA_EXPERT_FUSIONS = "1"
RPU_RHINOVLA_ADARMS_RESIDENT = "1"
RPU_RHINOVLA_ALIGNED_KV = "1"
RPU_RHINOVLA_PACKED_QKV = "0"
RPU_RHINOVLA_SKIP_ADARMS_GEMV = "0"

RPU_RHINOVLA_PRECOMPUTE_GATE_TANH = "0"
RPU_RHINOVLA_VISION_INPUT_CACHE = "1"
RPU_RHINOVLA_HIGH_PRECISION = "0"
RPU_RHINOVLA_HIGH_PRECISION_FUSIONS = "0"
RPU_RHINOVLA_VECTOR_K_NORM = "0"
RPU_RHINOVLA_VECTOR_Q_NORM = "0"
RPU_RHINOVLA_PARTIAL_ROPE = "0"

[input]
# 替换为匹配下列输入形状的文件；固定 fixture 须保留其身份与格式。
request = "/path/to/rhinovla-v3/rtc_request.pt"
# 此入口要求显式 true，仅加载调用者信任的模型代码。
trust_model_code = true
# 当前模型路径的固定去噪步数，不作为任意可调范围。
num_steps = 10

[run]
# 是否启用 inference_mode；复现已有测量时保持原值。
inference_mode = false
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 按需开启硬件采样；保持 false 可减少测量干扰。
hwperf = false
# 按需开启 profiler；正式计时建议保持 false。
profile = false
# 随机种子，非负整数。
seed = 0

[rpu_execution.components.vision_encoder.vision]
# Linear 累加精度。false 为 ACC16，true 为 ACC32；不改变权重位宽。
# 省略时默认 false（ACC16）。修改后需重新加载模型。
linear_acc32 = false
# Vision 分块行数。可选 "auto"（默认）或 16 的倍数整数；不补齐行。
# auto：由原生 planner 按图像 patch 数与本模型的核数选择。
# 2026-10-19 模板默认输入实测：8 核均为 768。
# 实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"
rpu_patch_embed = true
rpu_mergers = true
fused_merger = true
# vision Graph 快速回放，冷启动时选定，与累加精度设置无关。true 开启（模板默认），false 关闭。
# 省略时为 false。修改后需重新加载模型。
fast_replay = true
preload_replay_skip = true
bake_merger = true

[rpu_execution.components.language_model.prefill]
# Linear 累加精度。false 为 ACC16，true 为 ACC32；不改变权重位宽。
# 省略时默认 false（ACC16）。修改后需重新加载模型。
linear_acc32 = false
# pipeline 配方要求 prefix 物理行数 16 对齐（KV 写入对齐）。默认提示词实际 P230，补 10 行到 P240；
# 输入的 prefix 长度不同时，改为补到下一个 16 的倍数所需的行数（不增加有效 token）。
padding_rows = 10
# prefill 分块行数。可选 "auto"（默认）或满足本组件形状限制的 16 的倍数整数。
# auto：由原生 planner 按实际输入行数选择。
# 2026-10-19 模板默认输入实测：8 核均为 240。
# 实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"
prefix_prep_cache = true
prefix_prep_rpu = true
prefix_no_clone = true
partial_mrope = true
merger_scatter = true
# prefill Graph 快速回放，冷启动时选定，与累加精度设置无关。true 开启（模板默认），false 关闭。
# 省略时为 false。修改后需重新加载模型。
fast_replay = true
preload_replay_skip = true

[rpu_execution.components.action_expert.action]
# action 分块行数。可选 "auto"（默认）或满足本组件形状限制的 16 的倍数整数。
# auto：由原生 planner 按实际输入行数选择。
# 2026-10-19 模板默认输入实测：8 核均为 32。
# 实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"
denoise_unroll = true
shared_cache = true
prefix_alias = true
# action Graph 快速回放，冷启动时选定，与累加精度设置无关。true 开启（模板默认），false 关闭。
# 省略时为 false。修改后需重新加载模型。
fast_replay = true

[cpu]
# CPU intra-op 线程数，正整数；与 RPU 核数无关。
# 省略时不设置线程：PyTorch 使用环境变量 OMP_NUM_THREADS，未设置时使用全部 CPU 核（参考板 24）；2026-10-19 测量环境预设为 16。
threads = 12
