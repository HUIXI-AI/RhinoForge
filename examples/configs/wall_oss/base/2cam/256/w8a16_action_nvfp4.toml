# 未写出的执行参数（省略即按以下值运行）：
#   rpu_execution.model.num_cores 省略为 8；可写 4 / 6，修改后需重新加载模型：文本骨干为 Attention 4、MLP 4/6，Vision 和动作专家用 4 核；
#     只有 8 核实现的选项（Attention 8、多图批处理、vision_pair、融合 merger、行权重外循环、融合拼装、sorting SiLU、FP16 传输、动作权重驻留）在 4/6 核关闭，
#     linear_acc32 = true 和 instruction_residency 在 4/6 核报错；每路相机单独过一次 Vision，224 且 vision_window 开启时走逐窗口 SDPA，其余走稠密窗口 mask。
#   分块（chunk_size）模板未写出，按 auto 由入口选择；2026-10-19 模板默认输入实测：vision 672、action 32。可调范围见模型页。
# Wall-OSS base：真实相机输入，动作长度 32，10 步去噪，默认 8 核。
# 直接在本文件修改 text_tokens 和 linear_acc32，不另建 ACC 或文本长度配置。
# 下方 CPU 线程为 T32、ACC16 下选定的值；换输入或文本长度时可保留。
# prefill 执行行数由 planner 按真实 prefix 行数选择，不需要手动设置：≤384 行补到下一个 16 的倍数（单 chunk）；
#   385–448、449–512、513–640 行分别执行 448、512、640 行（等分两 chunk），超过 640 行报错（2026-10-23 板测，见性能报告）。
#   以上为 8 核规则；4/6 核 Attention 为 4 核，prefill 单块上限 320 行，由 planner 选能放进 SPM 的最少块数执行，不做等分两块（4/6 核已在板上通过运行时检查）。
# 相对路径按执行目录解析，请在仓库根目录运行。

[model]
target = "wall_oss"
# 本文件的权重/计算配方；切换精度须同时使用对应权重。
precision = "w8a16_action_nvfp4"
vision_window = false
vision_row_reuse = true
vision_pair = true
# 替换为匹配本模型与量化配方的本地资产路径或既有权重别名。
fp16_checkpoint = "/path/to/wall-oss-0.5"
# 替换为匹配本模型与量化配方的本地资产路径或既有权重别名。
w8_checkpoint = "/path/to/wall-oss-0.5-w8a16"

[input]
# 替换为匹配下列输入形状的文件；固定 fixture 须保留其身份与格式。
batch_template = "/path/to/{cameras}cam{image_size}_t{text_tokens}.pt"
# 可选 224 / 256；同时修改真实输入 tensor 与视觉执行参数。
image_size = [256, 256]
# 可选 2 / 3；真实图像数量与输入 tensor 必须同步修改。
cameras = 2
# 正整数；必须等于 text_length_scope 指定的实际 token 数。instruction 范围下本几何的真实 prefix 为 278+T 行，
#   须 ≤ 640 行，即 T ≤ 362。
text_tokens = 32
text_length_scope = "instruction"
# 当前模型路径的固定动作长度，须匹配 checkpoint。
action_horizon = 32
# 当前模型路径的固定去噪步数，不作为任意可调范围。
num_steps = 10

[cpu]
# CPU intra-op 线程数，正整数；与 RPU 核数无关。
# 省略时本入口使用 8。
threads = 8

[rpu_execution.prefill]
# prefill 分块行数。可选 "auto"（默认）或满足本组件形状限制的 16 的倍数整数。
# auto：由原生 planner 按实际输入行数选择。
# 2026-10-20 模板默认输入实测（auto，未设 padding_rows）：实际 310 行，执行 320 行，8 核分块 320。
# 实际值记录在结果 report.json 的执行计划中（compute_chunk）。
chunk_size = "auto"
# Linear 累加精度。false 为 ACC16，true 为 ACC32；不改变权重位宽。
# 省略时默认 false（ACC16）。修改后需重新加载模型。
linear_acc32 = false

[rpu_execution.vision]
# Linear 累加精度。false 为 ACC16，true 为 ACC32；不改变权重位宽。
# 省略时默认 false（ACC16）。修改后需重新加载模型。
linear_acc32 = false

[rpu_execution.action]
# Linear 累加精度。false 为 ACC16，true 为 ACC32；不改变权重位宽。
# 省略时默认 false（ACC16）。修改后需重新加载模型。
linear_acc32 = false

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 5
# 随机种子，非负整数。
seed = 0
# 结果输出目录；并发运行使用不同目录。
output_dir = "./wall_base_results/2cam/256/w8a16_action_nvfp4_t32_acc16"
