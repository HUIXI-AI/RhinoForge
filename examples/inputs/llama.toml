# Llama 3.2 1B 的输入预设：python examples/run.py --config <TOML> --input <预设名>
# --input canonical 取本文件的 canonical；--set input.<键> 的同名字段优先于预设。
#
# 预设只写长度字段，prompt 仍取所选 TOML 的值：prefill_tokens 把 prompt 的 token 截取或
# 重复到 P 个；stop_on_eos = false 时 decode 固定调用 D 次。
#
# 范围：物理 prefill 位置 + 执行长度 ≤ 64，由运行时检查。两个预设与 2026-10-21 板测的
# 输入相同。
applies_to = ["llama"]
canonical = "p64_d128"

[preset.p64_d32]
prefill_tokens = 64
decode_steps = 32
stop_on_eos = false

[preset.p64_d128]
prefill_tokens = 64
decode_steps = 128
stop_on_eos = false
