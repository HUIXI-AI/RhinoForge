[build-system]
requires = [
    "scikit-build-core>=0.12,<0.13",
    "torch==2.10.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "rhinoforge"
dynamic = ["version"]
authors = [{name = "HUIXI-AI"}]
description = "PyTorch inference backend and model deployment toolkit for Rhino RPU"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
keywords = ["pytorch", "rhinoforge", "inference", "transformers", "vla"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.1.0,<2",
    "huggingface-hub>=1.3,<2",
    "numpy>=2.0,<2.3",
    "safetensors>=0.4",
    "torch==2.10.0",
    "transformers==5.3.0",
]

[project.optional-dependencies]
audio = [
    "einops==0.8.2",
    "librosa==0.11.0",
    "onnxruntime==1.31.0",
    "soundfile==0.13.1",
    "sox==1.5.0",
    "torchaudio==2.10.0",
]
vision = [
    "pillow>=12.3.0",
    "torchvision==0.25.0",
]
vla = [
    "diffusers==0.33.1",
    "lerobot==0.5.1",
    "omegaconf>=2.3,<3",
    "pillow>=12.3.0",
    "pyyaml>=6",
    "qwen-vl-utils==0.0.14",
    "scipy>=1.15,<2",
    "torchvision==0.25.0",
]
dev = [
    "build>=1.2",
    "pytest>=8",
]

# External model adapters register into this entry-point group; see examples/custom_plugin_template/.
[project.entry-points."rpu_backend.plugins"]

[tool.scikit-build]
wheel.packages = ["python/rpu_backend"]
build.verbose = true
cmake.build-type = "Release"
build.tool-args = ["-j24"]
install.strip = true
wheel.exclude = [
    "tests/**",
    "**/tests/**",
    "**/test_*.py",
    "debug/**",
    "**/debug/**",
    "**/*.pyc",
    "**/*.bak*",
    "**/*.log",
]
wheel.license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '^(?P<value>[0-9]+\.[0-9]+\.[0-9]+(?:rc[0-9]+|\.dev[0-9]+)?)\s*$'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
filterwarnings = ["error::pytest.PytestReturnNotNoneWarning"]
