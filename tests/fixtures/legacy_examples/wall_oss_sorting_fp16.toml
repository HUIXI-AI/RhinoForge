# 未写出的执行参数（省略即按以下值运行）：
#   [cpu].threads 省略时不设置线程：PyTorch 使用环境变量 OMP_NUM_THREADS，未设置时使用全部 CPU 核（参考板 24）；2026-10-19 测量环境预设为 16。
#   rpu_execution.model.num_cores 固定 8 核。
#   分块（chunk_size）模板未写出，按 auto 由入口选择；2026-10-19 模板默认输入实测：vision 576、prefill 320、action 32。可调范围见模型页。
# 仅适用于快递分拣 WRC v728 模型；资产与输入格式见 README.md。
# 每个配置用独立进程运行，优化项在启动时选定。
[wall_oss_sorting]
# 本文件的权重/计算配方；切换精度须同时使用对应权重。
precision = "fp16"

[input]
# 替换为匹配本模型与量化配方的本地资产路径或既有权重别名。
fp16_checkpoint = "/path/to/wrc_sf_v728_0_15000"
# 替换为匹配下列输入形状的文件；固定 fixture 须保留其身份与格式。
batch = "/path/to/wrc_v728_batch.pt"
# 可选 0 / 1 / 3 / 10；非零时必须提供匹配的 prefix_actions。
inference_delay = 0 # RTC delay: 0, 1, 3, or 10; nonzero requires prefix_actions.

[run]
# 预热次数；不计入正式测量。
warmup = 2
# 正式执行次数，正整数。
runs = 6
# 结果输出目录；并发运行使用不同目录。
output_dir = "./wall_oss_sorting_results/fp16"
